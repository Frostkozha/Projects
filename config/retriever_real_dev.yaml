# Retriever REAL-MODEL DEVELOPMENT profile. Unevaluated: results are for development only.
# fixture mode: deterministic test encoder/reranker and synthetic corpus; never production-ready.
# For real_model_development: pin the 40-character commits of the locally provisioned models and set
# an explicitly *provisional* threshold. Production requires an evaluated threshold + evaluation_ref.
schema_version: retriever-profile-0.2
profile_version: real-dev-profile-0.1
operating_mode: real_model_development   # pinned real models, no student exposure
retrieval_policy_version: retrieval-policy-0.2
query_builder_version: fts5-literal-or-0.2
chunking_version: chunk-sentence-0.2
parser_normalization_version: nfc-ws-0.2

encoder:
  model_id: intfloat/e5-small-v2
  revision: ffb93f3bd4047442299a41ebb6fa998a38507c52
  tokenizer_revision: ffb93f3bd4047442299a41ebb6fa998a38507c52
  local_path: artifacts/encoders/e5-small-v2
  query_prefix: "query: "
  passage_prefix: "passage: "
  dimension: 384
  max_tokens: 512
  torch_threads: 2

reranker:
  model_id: cross-encoder/ms-marco-MiniLM-L6-v2
  revision: 233902d25c440f23af6f7d6e94d2946bac0bee0a   # pinned commit of the locally downloaded reranker
  local_path: artifacts/rerankers/ms-marco-MiniLM-L6-v2
  max_pair_tokens: 512
  batch_size: 8
  torch_threads: 2

search:
  dense_k: 30
  lexical_k: 30
  rrf_constant: 60
  rerank_k: 30
  max_passages: 5
  overlap_limit: 0.80

threshold:
  t_rerank: 0.0                # PROVISIONAL: unevaluated starting value for MiniLM raw logits
  status: provisional
  evaluation_ref: null

limits:
  max_query_chars: 4000
  max_query_tokens: 320
  chunk_target_tokens: 144
  chunk_max_tokens: 160
  heading_max_tokens: 24
  overlap_max_tokens: 24
  pair_reserve_tokens: 8
  max_passages_per_snapshot: 50000
  max_file_bytes: 104857600
  max_pdf_pages: 2000
  max_body_bytes: 32768

runtime:
  deadline_seconds: 5.0
  queue_capacity: 16
  stuck_worker_seconds: 30.0
  max_worker_restarts: 3

snapshots_root: artifacts/retriever/real/snapshots
revocations_path: artifacts/retriever/real/revocations.json
import_root: artifacts/retriever/sources
service_ids: [orchestrator]
